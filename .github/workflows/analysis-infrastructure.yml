name: analysis-infrastructure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check analysis scheduler permissions (read-only)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python scripts/probe_analysis_infrastructure.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-infrastructure-probe
          path: infrastructure-probe.json
