name: check-persian-news
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Regression tests (no publication)
        run: python -m unittest discover -s tests -p test_fa_news_language.py -v
      - name: Live Persian generation and backup (no Telegram token, no sends)
        env:
          QAI_BASE_URL: ${{ secrets.QAI_BASE_URL }}
          QAI_API_KEY: ${{ secrets.QAI_API_KEY }}
          QAI_MODEL: ${{ vars.QAI_MODEL }}
        run: python scripts/verify_persian_news.py
      - uses: actions/upload-artifact@v4
        with:
          name: persian-news-verification
          path: persian-news-verification.json
