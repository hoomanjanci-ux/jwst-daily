name: jwst-daily

# One hourly cron drives EVERYTHING (public repo => standard runners free & unlimited):
#   * every hour: publish top-2 pending analyses (4-image album, FA + EN)
#   * every ~20h: discovery/processing batch inside the 1.1 GB byte budget
# Scheduled runs may be delayed by GitHub under load (documented); the state ledger +
# backlog design compensates automatically. workflow_dispatch = manual catch-up.
# Keepalive: state/analyses commits prevent the 60-day inactivity auto-disable.

on:
  schedule:
    - cron: "37 * * * *"   # hourly, off-peak minute (UTC)
  workflow_dispatch:        # manual trigger (tests, recovery)

permissions:
  contents: write           # commit state.json + analyses/ back

concurrency:
  group: jwst-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest   # public repo: 4 vCPU / 16 GB RAM / 14 GB SSD (official)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline (batch if due -> publish top-2 hourly)
        env:
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_TEST_CHANNEL: ${{ secrets.TG_TEST_CHANNEL }}
          TG_CH_FA_AI:  ${{ secrets.TG_CH_FA_AI }}
          TG_CH_EN_AI:  ${{ secrets.TG_CH_EN_AI }}
          TG_CH_FA_OFF: ${{ secrets.TG_CH_FA_OFF }}
          TG_CH_EN_OFF: ${{ secrets.TG_CH_EN_OFF }}
          PROD_UNLOCKED: ${{ vars.PROD_UNLOCKED }}       # owner go-ahead flag (TEST-ONLY until then)
          QAI_BASE_URL:  ${{ secrets.QAI_BASE_URL }}     # free AI API (OpenAI-compatible) - owner provisioning
          QAI_API_KEY:   ${{ secrets.QAI_API_KEY }}
          QAI_MODEL:     ${{ vars.QAI_MODEL }}
          QAI_VISION_MODEL: ${{ vars.QAI_VISION_MODEL }}
          QAI_MIN_SCORE: ${{ vars.QAI_MIN_SCORE }}       # 0 = quality recorded only (test phase)
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}    # Cloudflare D1 - owner provisioning
          CF_API_TOKEN:      ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          MAX_BYTES: "1100000000"          # ~1 GB/day base scenario
          PUBLISH_COUNT: "2"               # mission spec: 2 selected items per hour
          BATCH_GAP_HOURS: "20"
        run: python pipeline/run_daily.py --max-bytes $MAX_BYTES

      - name: Commit state + analyses (ledger + keepalive)
        run: |
          git config user.name  "jwst-pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/state.json analyses/
          git commit -m "state: $(date -u +%F-%H:%M) [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push

      - name: Upload PNG samples as artifact (90-day retention, public repo = free)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-samples
          path: |
            /tmp/jwst_*/*.png
          if-no-files-found: ignore

      - name: Auto-alert on failure (test channel)
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_TEST_CHANNEL: ${{ secrets.TG_TEST_CHANNEL }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d chat_id="$TG_TEST_CHANNEL" \
            -d parse_mode="HTML" \
            -d text="⚠️ jwst-daily run FAILED — <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>open log</a>" \
            || echo "alert failed (non-blocking)"
